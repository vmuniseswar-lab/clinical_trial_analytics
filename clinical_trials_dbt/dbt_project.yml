name: 'clinical_trials_dbt'
version: '1.0.0'
config-version: 2

profile: 'clinical_trials_dbt'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  clinical_trials_dbt:
    staging:
      +materialized: view      # silver = views, lightweight
    marts:
      +materialized: table     # gold = tables, query-ready